<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#224a39" />
    <meta name="description" content="Annota i tuoi obiettivi, segui i progressi e raggiungi i tuoi traguardi con Faro." />
    <title>Faro</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module">
      if ('serviceWorker' in navigator && import.meta.env.PROD) {
        let refreshing = false
        const controlledAtLoad = Boolean(navigator.serviceWorker.controller)
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (controlledAtLoad && !refreshing) {
            refreshing = true
            location.reload()
          }
        })
        addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((registration) => registration.update()).catch(() => {})
        })
      }
    </script>
  </body>
</html>
