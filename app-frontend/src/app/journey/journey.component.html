<section class="journey-shell">
  <header class="journey-header">
    <div>
      <p class="page-eyebrow">Path Tracker</p>
      <input
        *ngIf="selectedGoal && !loading; else journeyTitle"
        class="goal-title-editor"
        aria-label="Goal title"
        [(ngModel)]="selectedGoal.title"
        (blur)="saveGoal()"
      >
      <ng-template #journeyTitle>
        <h1 class="page-title">Journey</h1>
      </ng-template>
    </div>

    <button
      *ngIf="selectedGoal && !loading"
      mat-icon-button
      type="button"
      class="archive-goal"
      aria-label="Archive goal"
      (click)="archiveGoal()"
    >
      <mat-icon>archive</mat-icon>
    </button>
  </header>

  <div class="goal-strip" *ngIf="goals.length > 0">
    <button
      type="button"
      class="goal-chip"
      *ngFor="let goal of goals; trackBy: trackById"
      [class.is-selected]="goal.id === selectedGoal?.id"
      (click)="selectGoal(goal.id)"
    >
      <span>{{ goal.title }}</span>
    </button>

    <button mat-mini-fab color="primary" type="button" class="add-goal-button" aria-label="Add goal" (click)="addGoal()">
      <mat-icon>add</mat-icon>
    </button>
  </div>

  <p class="state-message" *ngIf="loading">Loading your path...</p>

  <section class="error-panel" *ngIf="errorMessage">
    <strong>{{ errorMessage }}</strong>
    <span>Reload the database connection and try again.</span>
    <button mat-stroked-button type="button" (click)="load()">
      <mat-icon>refresh</mat-icon>
      Retry
    </button>
  </section>

  <article class="goal-detail" *ngIf="selectedGoal && !loading">
    <div class="progress-block">
      <div>
        <span>Progress</span>
        <strong>{{ selectedGoal.progress.completedTasks }}/{{ selectedGoal.progress.totalTasks }} tasks completed</strong>
      </div>
      <mat-progress-bar mode="determinate" [value]="selectedGoal.progress.percent"></mat-progress-bar>
    </div>

    <section class="step-list">
      <ion-item-sliding class="step-swipe sliding-card" *ngFor="let step of selectedGoal.steps; trackBy: trackById">
        <ion-item lines="none" class="step-slide-item sliding-card-item">
          <article class="step-panel note-card">
            <div class="step-header">
              <input
                class="step-title-editor"
                aria-label="Step title"
                [(ngModel)]="step.title"
                (blur)="saveStep(step)"
              >

              <button
                mat-icon-button
                type="button"
                [attr.aria-label]="isStepCollapsed(step) ? 'Expand step' : 'Collapse step'"
                (click)="toggleStepCollapsed(step)"
                class="collapse-step"
              >
                <mat-icon>{{ isStepCollapsed(step) ? 'expand_more' : 'expand_less' }}</mat-icon>
              </button>
            </div>

            <div class="task-list" *ngIf="!isStepCollapsed(step)">
              <div
                class="task-row"
                *ngFor="let task of step.tasks; trackBy: trackById"
                [class.is-done]="task.done"
                [class.is-placeholder]="task.body.trim() === ''"
              >
                <mat-checkbox [ngModel]="task.done" (change)="toggleTask(task)"></mat-checkbox>

                <div class="task-main">
                  <ion-textarea
                    class="task-body"
                    aria-label="Task"
                    placeholder="New task"
                    rows="1"
                    [autoGrow]="true"
                    [(ngModel)]="task.body"
                    (ionBlur)="handleTaskBlur(step, task)"
                  ></ion-textarea>
                  <div class="task-reminder-meta" *ngIf="task.body.trim() !== ''">
                    <span class="task-reminder-label" *ngIf="task.reminderFrequency !== 'none'">
                      {{ reminderLabel(task) }}
                    </span>
                    <button
                      mat-icon-button
                      type="button"
                      class="reminder-button"
                      [class.has-reminder]="task.reminderFrequency !== 'none'"
                      [attr.aria-label]="reminderLabel(task)"
                      [title]="reminderLabel(task)"
                      (click)="configureReminder(task)">
                      <mat-icon>{{ task.reminderFrequency === 'none' ? 'notifications_none' : 'notifications_active' }}</mat-icon>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </article>
        </ion-item>

        <ion-item-options side="end">
          <ion-item-option
            class="step-delete-action swipe-delete-action"
            aria-label="Delete step"
            (click)="deleteStep(step)"
          >
            <mat-icon>delete</mat-icon>
          </ion-item-option>
        </ion-item-options>
      </ion-item-sliding>
    </section>

    <button mat-stroked-button type="button" class="add-step-button" (click)="addStep()">
      <mat-icon>add</mat-icon>
      Step
    </button>
  </article>
</section>

<div class="end-page-spacer"></div>
